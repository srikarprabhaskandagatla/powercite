<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerCite Site Ranker</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='23' height='16' rx='3' fill='%23ea580c'/%3E%3Crect x='26' y='13' width='3' height='6' rx='1' fill='%23ea580c'/%3E%3Cpath d='M16 10l-5 8h4l-1 6 5-8h-4z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0;
  --surface-1: #fcfcfb;
  --surface-2: #efeee9;
  --border: #dddcd6;
  --text-primary: #0b0b0b;
  --text-secondary: #4a4946;
  --text-muted: #6b6a65;
  --accent: #c2410c;
  --ring: #fcfcfb;
  --boundary: #52514e;
  --substation: #52514e;
  --bar: #ea580c;
  --dim: #c9c8c2;
  --glass: rgba(252, 252, 251, 0.72);
  --good: #c2410c;
  --good-bg: #fff1e6;
  --ink: #141414;
  --ink-text: #fcfcfb;
  --bin-1: #fed7aa;
  --bin-2: #fdba74;
  --bin-3: #fb923c;
  --bin-4: #ea580c;
  --bin-5: #9a3412;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --surface-2: #242422;
    --border: #383835;
    --text-primary: #ffffff;
    --text-secondary: #ecebe6;
    --text-muted: #c9c8c0;
    --accent: #fb923c;
    --ring: #1a1a19;
    --boundary: #ecebe6;
    --substation: #ecebe6;
    --bar: #f97316;
    --dim: #3a3a37;
    --glass: rgba(26, 26, 25, 0.72);
    --good: #fdba74;
    --good-bg: rgba(251, 146, 60, 0.16);
    --ink: #ffffff;
    --ink-text: #121211;
    --bin-1: #7c2d12;
    --bin-2: #c2410c;
    --bin-3: #f97316;
    --bin-4: #fdba74;
    --bin-5: #ffedd5;
  }
  :root:not([data-theme="light"]) .base-tiles { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.85); }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --surface-2: #242422;
  --border: #383835;
  --text-primary: #ffffff;
  --text-secondary: #ecebe6;
  --text-muted: #c9c8c0;
  --accent: #fb923c;
  --ring: #1a1a19;
  --boundary: #ecebe6;
  --substation: #ecebe6;
  --bar: #f97316;
  --dim: #3a3a37;
  --glass: rgba(26, 26, 25, 0.72);
  --good: #fdba74;
  --good-bg: rgba(251, 146, 60, 0.16);
  --ink: #ffffff;
  --ink-text: #121211;
  --bin-1: #7c2d12;
  --bin-2: #c2410c;
  --bin-3: #f97316;
  --bin-4: #fdba74;
  --bin-5: #ffedd5;
}
:root[data-theme="dark"] .base-tiles { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.85); }
* { box-sizing: border-box; }
@supports not selector(::-webkit-scrollbar) {
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 60%, transparent) transparent; }
}
::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-track { background: color-mix(in srgb, var(--border) 45%, transparent); border-radius: 999px; margin: 6px; }
::-webkit-scrollbar-thumb { background-color: color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--accent); }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--surface-0);
  color: var(--text-primary);
  font: 14px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
.app { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
header {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px 20px; align-items: center;
  padding: 10px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border);
  position: relative; z-index: 2000;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 30px; height: 30px; flex: none; }
h1 { font: 700 22px/1 "Space Grotesk", "Inter", sans-serif; letter-spacing: -0.02em; margin: 0; }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
.town-title { font: 600 22px/1 "Space Grotesk", "Inter", sans-serif; letter-spacing: -0.01em; margin: 0; text-align: center; }
.sub { color: var(--text-secondary); margin: 0; font-size: 13px; }
.head-controls { display: flex; gap: 10px; align-items: center; justify-content: end; flex-wrap: wrap; }
.pop { position: relative; }
.tbtn { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; padding: 7px 12px; border-radius: 8px; }
.tbtn svg { width: 14px; height: 14px; transition: transform 0.15s; }
.tbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
.tbtn .tag { font-size: 12px; font-weight: 400; color: var(--text-muted); }
.menu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 2001; list-style: none; margin: 0; padding: 6px; min-width: 240px; }
.menu[hidden] { display: none; }
.menu button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 0; background: transparent; border-radius: 6px; padding: 8px 10px; text-align: left; }
.menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.menu button[aria-selected="true"] { font-weight: 600; color: var(--accent); }
.menu .tag { font-size: 12px; color: var(--text-muted); font-weight: 400; }
select, button, input[type="text"] {
  font: inherit;
  color: var(--text-primary);
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
}
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--text-muted); }
button:focus-visible, select:focus-visible, input:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-expanded="true"] { border-color: var(--accent); }
main { display: grid; grid-template-columns: clamp(260px, 25vw, 340px) minmax(0, 1fr); gap: 12px; padding: 12px 16px; min-height: 0; }
.panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; }
.list { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.list-head { padding: 12px 12px 8px; border-bottom: 1px solid var(--border); }
.list-head p { margin: 4px 0 0; color: var(--text-secondary); font-size: 12px; }
.list-scroll { overflow-y: auto; overflow-x: hidden; min-height: 0; flex: 1; }
table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
col.c-rank { width: 40px; }
col.c-fit { width: 38px; }
col.c-money { width: 66px; }
thead th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); text-align: left; font-weight: 600; padding: 7px 6px; color: var(--text-secondary); }
td { padding: 6px 6px; border-top: 1px solid var(--border); vertical-align: top; }
td.name b, td.name span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.selected { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
tbody tr.faded { opacity: 0.45; }
.muted { color: var(--text-muted); font-size: 12px; }
.right { display: grid; grid-template-rows: minmax(0, 1fr) clamp(190px, 28vh, 260px); gap: 12px; min-height: 0; }
.map-wrap { position: relative; isolation: isolate; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); min-height: 0; }
#map { position: absolute; inset: 0; background: var(--surface-1); }
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
  border: 1.5px solid color-mix(in srgb, var(--accent) 80%, transparent); border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
}
.map-wrap .leaflet-bar { border: 1.5px solid color-mix(in srgb, var(--accent) 80%, transparent); border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); }
.map-wrap .leaflet-bar a {
  background: var(--glass); color: var(--text-primary); border-bottom-color: var(--border);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.map-wrap .leaflet-bar a:hover { background: var(--surface-2); color: var(--accent); }
.map-wrap .leaflet-control-attribution { background: var(--glass); color: var(--text-secondary); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 34px; padding: 0; border-radius: 8px; }
.icon-btn svg { width: 18px; height: 18px; }
.overlay { position: absolute; z-index: 600; }
.legend { left: 10px; bottom: 22px; padding: 8px 10px; font-size: 12px; color: var(--text-secondary); max-width: 230px; }
.legend h3 { font-size: 12px; margin: 0 0 4px; color: var(--text-primary); }
.legend-row { display: flex; align-items: center; gap: 8px; margin: 2px 0; font-variant-numeric: tabular-nums; }
.swatch { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ring); box-shadow: 0 0 0 1px var(--border); }
.sq { width: 10px; height: 10px; border: 2px solid var(--substation); }
.legend .note { margin-top: 4px; color: var(--text-muted); }
.card { top: 10px; right: 10px; width: min(360px, calc(100% - 20px)); max-height: calc(100% - 20px); overflow: auto; padding: 14px; }
.card[hidden], .weights[hidden], .focus[hidden] { display: none; }
.card-top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.card h3 { margin: 0; font-size: 16px; }
.close { padding: 2px 8px; line-height: 1.2; }
.addr { color: var(--text-secondary); margin: 2px 0 10px; }
.big { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 10px; }
.big div { border-radius: 8px; padding: 10px 12px; }
.big b { display: block; font: 700 26px/1.1 "Space Grotesk", "Inter", sans-serif; font-variant-numeric: tabular-nums; }
.big span { font-size: 12px; }
.big .fit { background: var(--good-bg); border: 1px solid color-mix(in srgb, var(--good) 35%, transparent); }
.big .fit b { color: var(--good); }
.big .fit b small { font-size: 14px; font-weight: 500; opacity: 0.8; }
.big .fit span { color: var(--text-secondary); }
.big .cash { background: var(--ink); color: var(--ink-text); }
.big .cash span { color: color-mix(in srgb, var(--ink-text) 75%, transparent); }
.why { margin: 0 0 10px; font-size: 13px; }
.why p { margin: 0 0 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0 0 10px; font-size: 13px; }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.factor { display: grid; grid-template-columns: 120px 1fr 36px; gap: 8px; align-items: center; font-size: 12px; color: var(--text-secondary); margin: 3px 0; }
.factor .track {
  display: block; position: relative; height: 10px; border-radius: 999px; overflow: hidden;
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface-2) 80%, transparent);
}
.factor .track::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to right, transparent 0 calc(25% - 1px), color-mix(in srgb, var(--surface-1) 70%, transparent) calc(25% - 1px) 25%);
}
.factor .fill { display: block; height: 100%; background: linear-gradient(to right, var(--bin-3), var(--bin-5)); border-radius: 999px; }
.factor span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-primary); }
.small-head { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 10px 0 4px; }
.weights { position: absolute; top: calc(100% + 8px); right: 0; width: min(300px, calc(100vw - 32px)); padding: 12px; z-index: 2001; }
.slider { margin: 0 0 8px; }
.slider label { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); }
.slider label b { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
.slider input {
  -webkit-appearance: none; appearance: none; width: 100%; height: 8px; margin: 8px 0 4px;
  border-radius: 999px; border: 1px solid var(--border); cursor: pointer;
  background: linear-gradient(to right, var(--accent) 0 var(--val, 50%), var(--surface-2) var(--val, 50%) 100%);
}
.slider input::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%;
  background: var(--surface-1); border: 3px solid var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
}
.slider input::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--surface-1); border: 3px solid var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
}
.slider input::-moz-range-track { background: transparent; }
.slider input:active::-webkit-slider-thumb { transform: scale(1.1); }
.weights p { margin: 4px 0 0; font-size: 12px; color: var(--text-muted); }
.focus { top: 10px; left: calc(50% + 20px); transform: translateX(-50%); padding: 6px 8px 6px 12px; display: flex; gap: 10px; align-items: center; font-size: 13px; max-width: calc(100% - 140px); }
.bottom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px; min-height: 0; }
.box { display: flex; flex-direction: column; min-height: 0; padding: 10px 12px; }
.box-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 8px; }
.box-scroll { overflow: auto; min-height: 0; flex: 1; }
.empty { color: var(--text-muted); margin: 0; }
.look { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.look button { width: 100%; text-align: left; padding: 6px 10px; }
.look .meta { display: block; color: var(--text-muted); font-size: 12px; }
.faq { display: flex; flex-direction: column; gap: 8px; min-height: 0; flex: 1; }
.ask { display: flex; gap: 6px; margin: 0 0 8px; }
.ask[hidden] { display: none; }
.qlist { display: flex; flex-wrap: wrap; gap: 6px; }
.qlist li { margin: 0; }
.qlist button { width: auto; border-radius: 999px; padding: 5px 12px; }
.short { margin: 0 0 6px; font-size: 14px; }
.short b { color: var(--accent); }
.quote { margin: 0; font-size: 13px; color: var(--text-secondary); border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; }
.quote .head { display: block; font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.ask input { flex: 1; min-width: 0; }
.ask input:disabled, .ask button:disabled { opacity: 0.6; cursor: not-allowed; }
.qlist { list-style: none; margin: 0; padding: 0; }
.qlist button { font-size: 13px; }
.qlist button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.evidence { border-left: 3px solid var(--border); padding: 2px 0 2px 10px; margin: 8px 0; }
.evidence .head { font-size: 12px; color: var(--text-secondary); margin: 0 0 4px; }
.evidence p { margin: 0; font-size: 13px; }
.notice { color: var(--text-secondary); background: var(--surface-2); border-radius: 6px; padding: 6px 8px; margin: 0 0 8px; font-size: 13px; }
mark { background: transparent; color: var(--text-primary); font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
a { color: var(--accent); }
.leaflet-tooltip { background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); box-shadow: none; }
@media (max-width: 1100px) {
  .faq { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  header { grid-template-columns: 1fr auto; }
  .town-title { display: none; }
}
@media (max-width: 900px) {
  .app { height: auto; display: block; }
  main { grid-template-columns: 1fr; }
  .right { grid-template-rows: 70vh auto; }
  .list { order: 2; max-height: 60vh; }
  .bottom { grid-template-columns: 1fr; }
  .box { max-height: 60vh; }
  .card { width: calc(100% - 20px); max-height: 55%; }
  .focus { max-width: calc(100% - 20px); top: auto; bottom: 10px; }
  .legend { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="8" width="23" height="16" rx="3" fill="#ea580c"/><rect x="26" y="13" width="3" height="6" rx="1" fill="#ea580c"/><path d="M16 10l-5 8h4l-1 6 5-8h-4z" fill="#ffffff"/></svg>
      <h1>PowerCite</h1>
    </div>
    <p class="town-title" id="town-title" aria-live="polite"></p>
    <div class="head-controls">
      <div class="pop">
        <button class="tbtn" id="town-toggle" aria-haspopup="listbox" aria-expanded="false" aria-controls="town-menu">
          <span class="tag">Town</span><span id="town-label"></span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul class="menu glass" id="town-menu" role="listbox" aria-label="Choose a town" hidden></ul>
      </div>
      <button class="tbtn icon-btn" id="theme-toggle" aria-label="Theme" title="Theme"></button>
      <div class="pop">
        <button class="tbtn" id="weights-toggle" aria-expanded="false" aria-controls="weights">Priorities
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <section class="weights glass" id="weights" hidden aria-label="Priorities">
          <div id="sliders"></div>
          <button id="reset">Reset</button>
          <p id="weight-note"></p>
        </section>
      </div>
    </div>
  </header>

  <main>
    <aside class="panel list" aria-label="Ranked sites">
      <div class="list-head">
        <h2>Rankings</h2>
        <p><b>Fit</b> is 0 to 100, higher is better. <b>$/mo</b> is a guess before battery cost.</p>
      </div>
      <div class="list-scroll" id="list-scroll">
        <table>
          <colgroup><col class="c-rank"><col><col class="c-fit"><col class="c-money"></colgroup>
          <thead>
            <tr>
              <th class="num">#</th>
              <th>Business</th>
              <th class="num">Fit</th>
              <th class="num" title="Money a month">$/mo</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </aside>

    <div class="right">
      <div class="map-wrap">
        <div id="map" role="region" aria-label="Map of ranked battery sites"></div>
        <div class="overlay glass legend" id="legend"></div>
        <section class="overlay glass card" id="card" aria-live="polite" hidden></section>
        <div class="overlay glass focus" id="focus" hidden>
          <span id="focus-text"></span>
          <button class="close" id="focus-clear" aria-label="Clear">Clear</button>
        </div>
      </div>

      <div class="bottom">
        <section class="panel box" aria-label="Lookalike sites">
          <div class="box-head">
            <h2>Similar</h2>
            <span class="muted" id="look-for"></span>
          </div>
          <div class="box-scroll" id="lookalikes"><p class="empty">Pick a site to see 5 like it.</p></div>
        </section>

        <section class="panel box" aria-label="Questions about rates">
          <div class="box-head">
            <h2>Rates</h2>
            <span class="muted">From utility pages</span>
          </div>
          <div class="ask" hidden>
            <input type="text" placeholder="Ask your own question (coming soon)" disabled aria-label="Ask a question, coming soon">
            <button disabled>Ask</button>
          </div>
          <div class="faq">
            <ul class="qlist" id="questions"></ul>
            <div class="box-scroll" id="answer"><p class="empty">Pick one to see it on the map.</p></div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const FACTORS = [
  ["savings", "Savings", "How much the battery can cut the bill, compared with other sites"],
  ["spikiness", "Spikes", "Businesses with short, sharp peaks gain more"],
  ["space", "Space", "Open land to place a battery"],
  ["grid", "Grid", "Distance to the nearest substation"],
  ["confidence", "Data", "How much we trust the numbers for this site"]
];
const UTILITY_NAMES = {
  national_grid: "National Grid",
  eversource_south_shore: "Eversource South Shore",
  eversource_greater_boston: "Eversource Greater Boston"
};
const TOWN_UTILITY = {
  brockton: "national_grid",
  fall_river: "national_grid",
  new_bedford: "eversource_south_shore",
  worcester: "national_grid",
  lowell: "national_grid"
};
const DEMO_QUESTIONS = {
  q02: {
    label: "National Grid",
    short: "Large National Grid customers pay <b>$10.48 per kW</b> of their monthly peak.",
    keys: ["Demand $10.48 per kW"]
  },
  q05: {
    label: "Eversource",
    short: "Eversource South Shore G-2 pays <b>$3.72 + $13.74 per kVA</b>, which is $17.46 in all.",
    keys: ["Distribution Demand Charge (per kVA): $3.72", "Transmission Demand Charge (per kVA): $13.74"]
  },
  q10: {
    label: "Program",
    short: "ConnectedSolutions Daily Dispatch pays a business battery <b>$200 per kW</b> each summer.",
    keys: ["$200/kW"]
  }
};
const BINS = 5;
const BIN_WORDS = ["Low", "Weak", "Fair", "Good", "Best"];

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const money = v => "$" + Math.round(v).toLocaleString("en-US");
const num = v => Math.round(v).toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

const state = { towns: [], data: null, weights: {}, defaults: {}, selected: null, markers: new Map(), rag: [], question: null, focus: null };

const map = L.map("map", { preferCanvas: true, zoomControl: false });
L.control.zoom({ position: "topleft" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  className: "base-tiles",
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
let townLayer = L.layerGroup().addTo(map);

function quantileEdges(values) {
  const sorted = [...values].sort((a, b) => a - b);
  return Array.from({ length: BINS - 1 }, (_, i) => sorted[Math.floor((i + 1) * sorted.length / BINS)]);
}

function binOf(score, edges) {
  return edges.filter(e => score >= e).length;
}

function buildSliders() {
  $("sliders").innerHTML = `<p style="margin:0 0 8px;color:var(--text-secondary)">Slide to change what counts most.</p>` +
    FACTORS.map(([key, label, help]) => `
    <div class="slider">
      <label for="w-${key}" title="${esc(help)}">${label}<b id="wv-${key}"></b></label>
      <input type="range" id="w-${key}" min="0" max="100" step="5" value="${Math.round(state.weights[key] * 100)}">
    </div>`).join("");
  FACTORS.forEach(([key]) => {
    paintSlider($(`w-${key}`));
    $(`w-${key}`).addEventListener("input", e => {
      state.weights[key] = Number(e.target.value) / 100;
      paintSlider(e.target);
      rescore();
    });
  });
}

function paintSlider(input) {
  input.style.setProperty("--val", `${input.value}%`);
}

function renderTownMenu() {
  const current = state.data ? state.data.id : null;
  $("town-menu").innerHTML = state.towns.map(t =>
    `<li><button role="option" data-town="${esc(t.id)}" aria-selected="${t.id === current}">${esc(t.name)}<span class="tag">${esc(UTILITY_NAMES[TOWN_UTILITY[t.id]] || "")}</span></button></li>`
  ).join("");
}

function setMenuOpen(menu, toggle, open) {
  $(menu).hidden = !open;
  $(toggle).setAttribute("aria-expanded", String(open));
}

function weightShares() {
  const total = FACTORS.reduce((t, [k]) => t + state.weights[k], 0);
  return Object.fromEntries(FACTORS.map(([k]) => [k, total > 0 ? state.weights[k] / total : 0]));
}

function inFocus(s) {
  return !state.focus || state.focus.test(s);
}

function rescore() {
  const shares = weightShares();
  FACTORS.forEach(([k]) => { $(`wv-${k}`).textContent = `${Math.round(shares[k] * 100)}%`; });
  const changed = FACTORS.some(([k]) => Math.abs(state.weights[k] - state.defaults[k]) > 1e-9);
  $("weight-note").textContent = changed
    ? "Custom."
    : "Default.";

  const sites = state.data.sites;
  sites.forEach(s => {
    s.live = 100 * FACTORS.reduce((t, [k]) => t + shares[k] * s[`f_${k}`], 0);
  });
  [...sites].sort((a, b) => b.live - a.live).forEach((s, i) => { s.liveRank = i + 1; });

  const edges = quantileEdges(sites.map(s => s.live));
  sites.forEach(s => { s.bin = binOf(s.live, edges); });
  restyle();
  drawLegend(edges, sites.map(s => s.live));
  renderTable();
  if (state.selected) renderCard(state.data.sites.find(s => s.id === state.selected));
}

function restyle() {
  [...state.data.sites].sort((a, b) => (inFocus(a) - inFocus(b)) || (a.live - b.live)).forEach(s => {
    const m = state.markers.get(s.id);
    m.setStyle(markerStyle(s));
    m.bringToFront();
  });
  const sel = state.markers.get(state.selected);
  if (sel) sel.bringToFront();
}

function markerStyle(s) {
  const selected = s.id === state.selected;
  const on = inFocus(s) && (!state.selected || selected);
  return {
    color: selected ? css("--text-primary") : css("--ring"),
    weight: selected ? 3 : on ? 2 : 1,
    fillColor: on ? css(`--bin-${s.bin + 1}`) : css("--dim"),
    fillOpacity: on ? 1 : state.selected ? 0.35 : 0.6,
    opacity: on || selected ? 1 : 0.4
  };
}

function drawLegend(edges, scores) {
  const bounds = [Math.min(...scores), ...edges, Math.max(...scores)];
  const rows = Array.from({ length: BINS }, (_, i) => BINS - 1 - i).map(i =>
    `<div class="legend-row"><span class="swatch" style="background:var(--bin-${i + 1})"></span>${BIN_WORDS[i]}, ${Math.round(bounds[i])} to ${Math.round(bounds[i + 1])}</div>`
  ).join("");
  $("legend").innerHTML = `<h3>Fit</h3>${rows}
    <div class="legend-row"><span class="sq"></span>Substation</div>
    <div class="note">Color is fit. Size is money.</div>`;
}

function renderTable() {
  const sites = [...state.data.sites].sort((a, b) => a.liveRank - b.liveRank);
  $("rows").innerHTML = sites.map(s => {
    const move = s.rank - s.liveRank;
    const arrow = move > 0 ? `<br><span class="muted" aria-label="up ${move}">+${move}</span>` : move < 0 ? `<br><span class="muted" aria-label="down ${-move}">${move}</span>` : "";
    const cls = [s.id === state.selected ? "selected" : "", inFocus(s) ? "" : "faded"].join(" ");
    return `<tr data-id="${esc(s.id)}" tabindex="0" class="${cls}" title="${esc(s.name)}, ${esc(s.addr)}">
      <td class="num">${s.liveRank}${arrow}</td>
      <td class="name"><b>${esc(s.name)}</b><span class="muted">${esc(s.addr)}</span></td>
      <td class="num">${Math.round(s.live)}</td>
      <td class="num">${money(s.value)}</td>
    </tr>`;
  }).join("");
}

function renderCard(s) {
  const shares = weightShares();
  const total = state.data.sites.length;
  const factors = FACTORS.map(([k, label, help]) => {
    const part = 100 * shares[k] * s[`f_${k}`];
    return `<div class="factor" title="${esc(help)}"><span>${label}</span><span class="track"><span class="fill" style="width:${Math.min(100, s[`f_${k}`] * 100)}%"></span></span><span>${part.toFixed(1)}</span></div>`;
  }).join("");
  const info = (state.data.tariff.classes || {})[s.rate_class];
  const source = info ? ` <a href="${esc(info.url)}" target="_blank" rel="noopener">source</a>` : "";
  const weak = s.weak && s.weak !== "No clear weak point" ? `<p><b>Weak.</b> ${esc(s.weak)}</p>` : "";
  const card = $("card");
  card.hidden = false;
  card.innerHTML = `
    <div class="card-top">
      <h3>#${s.liveRank} ${esc(s.name)}</h3>
      <button class="close" id="card-close" aria-label="Close">x</button>
    </div>
    <p class="addr">${esc(s.addr)}, ${esc(state.data.name)}</p>
    <div class="big">
      <div class="fit"><b>${Math.round(s.live)}<small> / 100</small></b><span>Fit, rank ${s.liveRank} of ${total}</span></div>
      <div class="cash"><b>${money(s.value)}</b><span>Per month, before battery cost</span></div>
    </div>
    <dl class="kv">
      <dt>Savings</dt><dd>${money(s.bill)} a month</dd>
      <dt>Program</dt><dd>${money(s.incentive)} a month</dd>
    </dl>
    <div class="why">
      <p><b>Why.</b> ${esc(s.reason)}.</p>
      ${weak}
    </div>
    <p class="small-head">Breakdown</p>
    ${factors}
    <p class="small-head">Details</p>
    <dl class="kv">
      <dt>Type</dt><dd>${esc(s.use)}</dd>
      <dt>Peak</dt><dd>${num(s.peak_kw)} kW</dd>
      <dt>Battery</dt><dd>${s.battery_kw} kW</dd>
      <dt>Rate</dt><dd>${esc(s.rate_class)} at $${s.rate.toFixed(2)} per kW${source}</dd>
      <dt>Floor</dt><dd>${num(s.floor_area)} m2</dd>
      <dt>Lot</dt><dd>${num(s.open_lot)} m2</dd>
      <dt>Substation</dt><dd>${num(s.dist_sub)} m, ${esc(s.substation || "unnamed")}</dd>
      <dt>Owner</dt><dd>${esc(s.owner)}</dd>
      <dt>Data</dt><dd>${esc(s.confidence)}</dd>
    </dl>`;
  $("card-close").addEventListener("click", clearSelection);
}

function renderLookalikes(s) {
  const list = state.data.lookalikes[s.id] || [];
  $("look-for").textContent = `like ${s.name}`;
  if (!list.length) {
    $("lookalikes").innerHTML = `<p class="empty">No similar businesses saved for this site.</p>`;
    return;
  }
  const townName = id => (state.towns.find(t => t.id === id) || { name: id }).name;
  $("lookalikes").innerHTML = `<ul class="look">${list.map(m => {
    const ratio = s.floor_area > 0 ? m.floor_area / s.floor_area : 1;
    const size = ratio >= 1 ? `${ratio.toFixed(1)}x the size` : `${(1 / ratio).toFixed(1)}x smaller`;
    return `<li><button data-town="${esc(m.town)}" data-id="${esc(m.id)}">
      <b>${esc(m.name)}</b>
      <span class="meta">${esc(m.addr)}, ${esc(townName(m.town))}, rank ${m.rank} there</span>
      <span class="meta">${esc(m.use)}, ${size}, ${money(m.value)} a month</span>
    </button></li>`;
  }).join("")}</ul>`;
}

function clearSelection() {
  state.selected = null;
  restyle();
  $("card").hidden = true;
  $("look-for").textContent = "";
  $("lookalikes").innerHTML = `<p class="empty">Pick a site to see 5 like it.</p>`;
  document.querySelectorAll("#rows tr.selected").forEach(tr => tr.classList.remove("selected"));
}

function select(id, fly) {
  const s = state.data.sites.find(x => x.id === id);
  if (!s) return;
  state.selected = id;
  restyle();
  if (fly) map.flyTo([s.lat, s.lon], Math.max(map.getZoom(), 16), { duration: 0.6 });
  renderCard(s);
  renderLookalikes(s);
  document.querySelectorAll("#rows tr").forEach(tr => tr.classList.toggle("selected", tr.dataset.id === id));
  const row = document.querySelector(`#rows tr[data-id="${CSS.escape(id)}"]`);
  if (row) row.scrollIntoView({ block: "nearest" });
}

function questionScope(q) {
  const text = q.question;
  const header = (q.evidence[0] || {}).header || "";
  if (/home|residential/i.test(text) || /Mass Save/.test(header)) return { kind: "home" };
  const cls = (text.match(/G-\d/) || [])[0] || null;
  let utility = null;
  if (/South Shore/.test(text)) utility = "eversource_south_shore";
  else if (/Greater Boston/.test(text)) utility = "eversource_greater_boston";
  else if (/National Grid/.test(text)) utility = "national_grid";
  if (!utility && /ConnectedSolutions/.test(text)) return { kind: "program" };
  return { kind: "rate", utility, cls };
}

function applyFocus() {
  state.focus = null;
  const q = state.rag.find(x => x.id === state.question);
  let message = null;
  let action = "";
  if (q) {
    const scope = questionScope(q);
    const town = state.data.name;
    const here = TOWN_UTILITY[state.data.id];
    if (scope.kind === "home") {
      message = "This question is about home batteries. The map shows businesses only.";
    } else if (scope.kind === "program") {
      state.focus = { test: s => s.incentive > 0 };
      const n = state.data.sites.filter(state.focus.test).length;
      message = `${n} of ${state.data.sites.length} sites in ${town} can get this program pay.`;
    } else if (scope.utility && scope.utility !== here) {
      const other = Object.keys(TOWN_UTILITY).find(t => TOWN_UTILITY[t] === scope.utility);
      message = `This rate is for ${UTILITY_NAMES[scope.utility]}. ${town} is on ${UTILITY_NAMES[here]}.`;
      if (other) action = other;
      else message += " None of our five towns use it.";
    } else {
      state.focus = scope.cls ? { test: s => s.rate_class === scope.cls } : null;
      const n = state.focus ? state.data.sites.filter(state.focus.test).length : state.data.sites.length;
      message = scope.cls
        ? `${n} of ${state.data.sites.length} sites in ${town} are on ${scope.cls}. They are shown in color.`
        : `All ${n} sites in ${town} use this rate sheet.`;
    }
  }
  const bar = $("focus");
  if (message) {
    const townName = (state.towns.find(t => t.id === action) || {}).name;
    $("focus-text").innerHTML = esc(message) + (action ? ` <button id="focus-go" data-town="${esc(action)}">Go to ${esc(townName)}</button>` : "");
    bar.hidden = false;
  } else {
    bar.hidden = true;
  }
  restyle();
  renderTable();
}

function highlight(text, terms) {
  let out = esc(text);
  terms.forEach(t => {
    const safe = esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    out = out.replace(new RegExp(safe, "g"), m => `<mark>${m}</mark>`);
  });
  return out;
}

function renderQuestions() {
  $("questions").innerHTML = state.rag.map(q =>
    `<li><button data-q="${esc(q.id)}" aria-pressed="${q.id === state.question}" title="${esc(q.question)}">${esc(DEMO_QUESTIONS[q.id].label)}</button></li>`
  ).join("");
}

function snippet(text, keys) {
  const spots = keys.map(k => text.indexOf(k)).filter(i => i >= 0);
  if (!spots.length) return esc(text.slice(0, 160)) + "...";
  const start = Math.max(0, Math.min(...spots) - 50);
  const end = Math.min(text.length, Math.max(...keys.map(k => { const i = text.indexOf(k); return i < 0 ? 0 : i + k.length; })) + 30);
  return (start > 0 ? "..." : "") + highlight(text.slice(start, end), keys) + (end < text.length ? "..." : "");
}

function showAnswer(id) {
  state.question = state.question === id ? null : id;
  renderQuestions();
  applyFocus();
  const q = state.rag.find(x => x.id === state.question);
  if (!q) {
    $("answer").innerHTML = `<p class="empty">Pick one to see it on the map.</p>`;
    return;
  }
  const demo = DEMO_QUESTIONS[q.id];
  const e = q.evidence.find(x => demo.keys.some(k => x.text.includes(k))) || q.evidence[0];
  const page = e.header.split(",")[0];
  $("answer").innerHTML = `<p class="short">${demo.short}</p>
    <p class="quote">${snippet(e.text, demo.keys)}<span class="head">From ${esc(page)}, page ${esc(e.page_no)}. <a href="${esc(e.url)}" target="_blank" rel="noopener">Open page</a></span></p>`;
}

async function loadTown(id, selectId) {
  const data = await (await fetch(`data/${id}.json`)).json();
  state.data = data;
  state.selected = null;
  state.markers.clear();
  townLayer.remove();
  townLayer = L.layerGroup();
  history.replaceState(null, "", `?town=${encodeURIComponent(id)}`);
  $("town-label").textContent = data.name;
  $("town-title").textContent = data.name;
  document.title = `${data.name}, PowerCite`;
  renderTownMenu();

  const border = state.border = L.geoJSON(data.boundary, { style: { color: css("--boundary"), weight: 2, fill: false, dashArray: "4 4" }, interactive: false });
  map.invalidateSize();
  map.fitBounds(border.getBounds(), { padding: [12, 12] });
  townLayer.addTo(map);
  border.addTo(townLayer);

  data.substations.forEach(s => {
    L.marker([s.lat, s.lon], {
      icon: L.divIcon({ className: "", html: `<div class="sq"></div>`, iconSize: [10, 10] }),
      keyboard: false
    }).bindTooltip(`${esc(s.name)}, power substation${s.voltage ? ", " + esc(s.voltage) + " V" : ""}`).addTo(townLayer);
  });

  const maxValue = Math.max(...data.sites.map(s => s.value));
  data.sites.forEach(s => {
    const m = L.circleMarker([s.lat, s.lon], { radius: 4 + 6 * Math.sqrt(Math.max(s.value, 0) / maxValue), bubblingMouseEvents: false })
      .bindTooltip(() => `#${s.liveRank} ${esc(s.name)}, fit ${Math.round(s.live)}, ${money(s.value)} a month`)
      .on("click", () => select(s.id, false))
      .addTo(townLayer);
    m.siteId = s.id;
    state.markers.set(s.id, m);
  });

  rescore();
  clearSelection();
  applyFocus();
  $("list-scroll").scrollTop = 0;
  if (selectId) {
    if (data.sites.some(s => s.id === selectId)) select(selectId, true);
    else {
      $("focus-text").textContent = `That business is not in the top ${data.sites.length} of ${data.name}, which is why it is not on this map.`;
      $("focus").hidden = false;
    }
  }
}

const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';

function currentTheme() {
  const set = document.documentElement.dataset.theme;
  if (set) return set;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("powercite-theme", theme); } catch (e) {}
  const btn = $("theme-toggle");
  btn.innerHTML = theme === "dark" ? SUN : MOON;
  btn.setAttribute("aria-label", theme === "dark" ? "Light theme" : "Dark theme");
  btn.title = theme === "dark" ? "Light" : "Dark";
  if (state.data) {
    if (state.border) state.border.setStyle({ color: css("--boundary") });
    rescore();
  }
}

async function init() {
  let saved = null;
  try { saved = localStorage.getItem("powercite-theme"); } catch (e) {}
  applyTheme(saved === "light" || saved === "dark" ? saved : currentTheme());
  $("theme-toggle").addEventListener("click", () => applyTheme(currentTheme() === "dark" ? "light" : "dark"));
  const [towns, rag] = await Promise.all([
    fetch("data/towns.json").then(r => r.json()),
    fetch("data/rag.json").then(r => r.json())
  ]);
  state.towns = towns;
  state.rag = rag.filter(q => DEMO_QUESTIONS[q.id]);
  renderTownMenu();
  const first = await fetch(`data/${towns[0].id}.json`).then(r => r.json());
  state.defaults = { ...first.weights };
  state.weights = { ...first.weights };
  buildSliders();
  renderQuestions();

  const menus = [["town-menu", "town-toggle"], ["weights", "weights-toggle"]];
  menus.forEach(([menu, toggle]) => {
    $(toggle).addEventListener("click", () => {
      const open = $(menu).hidden;
      menus.forEach(([m, t]) => setMenuOpen(m, t, false));
      setMenuOpen(menu, toggle, open);
    });
  });
  document.addEventListener("click", e => {
    menus.forEach(([menu, toggle]) => {
      if (!$(menu).hidden && !$(menu).parentElement.contains(e.target)) setMenuOpen(menu, toggle, false);
    });
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    const open = menus.find(([menu]) => !$(menu).hidden);
    if (open) { setMenuOpen(open[0], open[1], false); $(open[1]).focus(); }
    else if (state.selected) clearSelection();
  });
  $("town-menu").addEventListener("click", e => {
    const b = e.target.closest("button[data-town]");
    if (!b) return;
    setMenuOpen("town-menu", "town-toggle", false);
    if (b.dataset.town !== state.data.id) loadTown(b.dataset.town);
  });
  $("town-menu").addEventListener("keydown", e => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    const items = [...$("town-menu").querySelectorAll("button")];
    const i = items.indexOf(document.activeElement);
    items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus();
  });
  $("reset").addEventListener("click", () => {
    state.weights = { ...state.defaults };
    FACTORS.forEach(([k]) => { $(`w-${k}`).value = Math.round(state.weights[k] * 100); paintSlider($(`w-${k}`)); });
    rescore();
  });
  $("rows").addEventListener("click", e => {
    const tr = e.target.closest("tr[data-id]");
    if (tr) select(tr.dataset.id, true);
  });
  $("rows").addEventListener("keydown", e => {
    const tr = e.target.closest("tr[data-id]");
    if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(tr.dataset.id, true); }
  });
  $("lookalikes").addEventListener("click", e => {
    const b = e.target.closest("button[data-id]");
    if (!b) return;
    if (b.dataset.town === state.data.id) select(b.dataset.id, true);
    else loadTown(b.dataset.town, b.dataset.id);
  });
  $("questions").addEventListener("click", e => {
    const b = e.target.closest("button[data-q]");
    if (b) showAnswer(b.dataset.q);
  });
  $("focus").addEventListener("click", e => {
    const go = e.target.closest("#focus-go");
    if (go) loadTown(go.dataset.town);
  });
  $("focus-clear").addEventListener("click", () => {
    if (state.question) showAnswer(state.question);
    else $("focus").hidden = true;
  });
  window.addEventListener("resize", () => map.invalidateSize());
  map.on("click", () => { if (state.selected) clearSelection(); });

  const wanted = new URLSearchParams(location.search).get("town");
  await loadTown(towns.some(t => t.id === wanted) ? wanted : towns[0].id);
}

init().catch(err => {
  $("focus-text").textContent = `Could not load the data. ${err.message}`;
  $("focus").hidden = false;
});
</script>
</body>
</html>
